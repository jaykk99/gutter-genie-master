<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gutter Genie — Master App</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#0b1f16;color:#e8f5ee;display:flex;height:100vh;overflow:hidden}
.sidebar{width:280px;background:#0f2b1f;border-right:1px solid #1d4432;padding:20px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;transition:transform .2s ease;z-index:20}
.logo{font-size:22px;font-weight:800;color:#4ade80;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.logo span{color:#e8f5ee}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;background:transparent;border:1px solid transparent;border-radius:10px;color:#c9e8d6;font-size:14px;text-align:left;cursor:pointer;transition:.15s}
.nav-btn:hover{background:#16402c}
.nav-btn.active{background:#1d5b3c;border-color:#2f855a;color:#fff}
.nav-btn .dot{width:8px;height:8px;border-radius:50%;background:#4ade80;flex-shrink:0}
.nav-section{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#6b9c80;margin:14px 4px 2px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{padding:14px 22px;border-bottom:1px solid #1d4432;display:flex;justify-content:space-between;align-items:center;background:#0f2b1f;gap:10px}
.topbar-left{display:flex;align-items:center;gap:12px;min-width:0}
.topbar h1{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar a{color:#4ade80;font-size:13px;text-decoration:none;white-space:nowrap}
.topbar a:hover{text-decoration:underline}
#menuBtn{display:none;background:none;border:1px solid #1d4432;color:#e8f5ee;border-radius:8px;padding:8px 10px;cursor:pointer;font-size:16px}
.frame-wrap{flex:1;position:relative;background:#fff;overflow-y:auto}
iframe{width:100%;height:100%;border:0}
.stats{padding:24px 40px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;background:#0b1f16}
.stat-card{background:#123626;border:1px solid #1d4432;border-radius:12px;padding:16px;text-align:center}
.stat-card .n{font-size:24px;font-weight:800;color:#4ade80}
.stat-card .l{font-size:11px;color:#9dc7af;text-transform:uppercase;letter-spacing:.5px;margin-top:4px}
.stat-card.money .n{color:#fbbf24}
.cards{padding:24px 40px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;overflow-y:auto;background:#0b1f16}
.card{background:#123626;border:1px solid #1d4432;border-radius:14px;padding:20px;cursor:pointer;transition:.15s}
.card:hover{border-color:#4ade80;transform:translateY(-2px)}
.card h3{color:#fff;font-size:16px;margin-bottom:6px}
.card p{color:#9dc7af;font-size:13px;line-height:1.5}
.card .url{color:#4ade80;font-size:12px;margin-top:10px;word-break:break-all}
.tag{display:inline-block;background:#1d5b3c;color:#a7f3c9;font-size:11px;padding:2px 8px;border-radius:20px;margin-bottom:8px}
.tag.soon{background:#3b3b1d;color:#fde047}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:15}
@media(max-width:900px){
  .sidebar{position:fixed;top:0;left:0;height:100%;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .sidebar.open + .overlay,body.nav-open .overlay{display:block}
  #menuBtn{display:inline-block}
  .stats,.cards{padding-left:18px;padding-right:18px}
}
</style>
</head>
<body>
<nav class="sidebar" id="sidebar">
  <div class="logo">🪠 Gutter <span>Genie</span></div>
  <div class="nav-section">Gutter Genie</div>
  <button class="nav-btn active" data-view="home"><span class="dot"></span>Home</button>
  <button class="nav-btn" data-view="jobs"><span class="dot"></span>📋 Jobs Tracker</button>
  <button class="nav-btn" data-view="email"><span class="dot"></span>Email Notifications</button>
  <button class="nav-btn" data-view="quote"><span class="dot"></span>ProQuote Estimator</button>
  <button class="nav-btn" data-view="quotemcp"><span class="dot"></span>Quote Engine API</button>
  <button class="nav-btn" data-view="media"><span class="dot"></span>Media Vault</button>
  <button class="nav-btn" data-view="calls"><span class="dot"></span>Call Console</button>
  <button class="nav-btn" data-view="site"><span class="dot"></span>Gutter Genie Site</button>
  <div class="nav-section">Other businesses</div>
  <button class="nav-btn" data-view="webworks"><span class="dot"></span>Winnipeg Web Works</button>
  <button class="nav-btn" data-view="moveandmetal"><span class="dot"></span>♻️ Move &amp; Metal</button>
</nav>
<div class="overlay" id="overlay"></div>
<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <button id="menuBtn" aria-label="Menu">☰</button>
      <h1 id="title">Master Dashboard</h1>
    </div>
    <a id="openExt" href="#" target="_blank">Open in new tab ↗</a>
  </div>
  <div class="frame-wrap" id="frameWrap">
    <div id="stats" class="stats"></div>
    <div class="cards" id="cards"></div>
  </div>
</div>
<script>
const APPS={
  jobs:{name:'Jobs Tracker',desc:'Searchable job log — customer names, addresses, zones, quotes, and statuses, live from Supabase. Syncs with Notion.',url:'jobs.html'},
  email:{name:'Email Notifications Dashboard',desc:'Unified inbox for Gutter Genie & Webworks emails — searchable, shows how long ago each email arrived.',url:'https://jaykk99.github.io/email-notifications-dashboard/'},
  quote:{name:'ProQuote Estimator',desc:'Eavestrough quote generator — build and send customer quotes.',url:'https://proquote-estimator.vercel.app'},
  quotemcp:{name:'Quote Engine API (MCP)',desc:'Connects job photos to notes, pricing and ready-to-send quotes.',url:'https://gutter-genie-quote-mcp.vercel.app'},
  media:{name:'Media Vault',desc:'PIN-gated photo/video/file uploader organized by project.',url:'https://gutter-genie-media.vercel.app'},
  calls:{name:'Call Console',desc:'Gutter Genie call handling console.',url:'https://guttergenie-call-console.vercel.app'},
  site:{name:'Gutter Genie Site',desc:'Customer-facing Gutter Genie website.',url:'https://guttergenie.vercel.app'},
  webworks:{name:'Winnipeg Web Works',desc:'Digital audit service landing page — now with a live AI audit chat widget.',url:'https://winnipeg-web-works.vercel.app'},
  moveandmetal:{name:'Move & Metal',desc:'Junk & scrap metal removal — Facebook page for now, no landing page built yet.',url:'https://www.facebook.com/profile.php?id=1379262015269430',soon:true}
};
const frameWrap=document.getElementById('frameWrap'),title=document.getElementById('title'),openExt=document.getElementById('openExt'),cards=document.getElementById('cards'),statsEl=document.getElementById('stats');
const sidebar=document.getElementById('sidebar'),menuBtn=document.getElementById('menuBtn'),overlay=document.getElementById('overlay');
function closeNav(){sidebar.classList.remove('open');document.body.classList.remove('nav-open');}
menuBtn.addEventListener('click',()=>{sidebar.classList.toggle('open');document.body.classList.toggle('nav-open');});
overlay.addEventListener('click',closeNav);

function renderCards(){
  cards.innerHTML=Object.entries(APPS).map(([k,a])=>`<div class="card" onclick="selectApp('${k}')"><span class="tag ${a.soon?'soon':''}">${a.soon?'Facebook only':'App'}</span><h3>${a.name}</h3><p>${a.desc}</p><div class="url">${a.url}</div></div>`).join('');
}
function selectApp(k){
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===k));
  const a=APPS[k];
  title.textContent=a.name; openExt.href=a.url;
  statsEl.style.display='none';
  frameWrap.innerHTML=`<iframe src="${a.url}" title="${a.name}" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>`;
  closeNav();
}
document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>{
  const v=b.dataset.view;
  document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');
  if(v==='home'){
    title.textContent='Master Dashboard';openExt.href='#';
    frameWrap.innerHTML='';
    frameWrap.appendChild(statsEl);frameWrap.appendChild(cards);
    statsEl.style.display='grid';
    renderCards();loadStats();
    closeNav();
  }
  else selectApp(v);
}));

// Live at-a-glance stats pulled from the same Supabase jobs table as the Jobs Tracker.
const SB_URL='https://fhbqxujlnqlmzvulrdxt.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZoYnF4dWpsbnFsbXp2dWxyZHh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2MTc0NDQsImV4cCI6MjEwMzE5MzQ0NH0.ThFmY_FXQlnaaI8GNLz9xSHATOacM9iOb8u0G0WFJ2w';
let sb;
try{ sb=supabase.createClient(SB_URL,SB_KEY); }catch(e){}
async function loadStats(){
  if(!sb){statsEl.innerHTML='';return;}
  try{
    const {data,error}=await sb.from('gg_projects').select('status,quote');
    if(error||!data){statsEl.innerHTML='';return;}
    const counts={};
    let totalValue=0;
    data.forEach(p=>{
      const s=(p.status||'new').toLowerCase();
      counts[s]=(counts[s]||0)+1;
      const amt=p.quote&&p.quote.total!=null?Number(p.quote.total):0;
      totalValue+=amt;
    });
    const money=n=>'$'+Math.round(n).toLocaleString();
    const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
    let cards=Object.keys(counts).sort().map(s=>
      `<div class="stat-card"><div class="n">${counts[s]}</div><div class="l">${cap(s)}</div></div>`).join('');
    cards+=`<div class="stat-card"><div class="n">${data.length}</div><div class="l">Total Jobs</div></div>`;
    cards+=`<div class="stat-card money"><div class="n">${money(totalValue)}</div><div class="l">Total quoted</div></div>`;
    statsEl.innerHTML=cards;
  }catch(e){statsEl.innerHTML='';}
}
renderCards();
loadStats();
</script>
</body>
</html>
