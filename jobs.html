<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jobs Tracker — Gutter Genie</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#0b1f16;color:#e8f5ee;min-height:100vh;padding:24px}
.wrap{max-width:1100px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px}
h1{color:#4ade80;font-size:24px}
.back{color:#9dc7af;text-decoration:none;font-size:14px}
.back:hover{color:#fff}
#syncStatus{font-size:12px;color:#9dc7af}
#syncStatus.ok{color:#4ade80}#syncStatus.err{color:#f87171}
.search-row{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
input,select,textarea{background:#0f2b1f;border:1px solid #1d4432;color:#e8f5ee;padding:10px 12px;border-radius:8px;font-size:14px;outline:none}
input:focus,select:focus{border-color:#4ade80}
#search{flex:1;min-width:220px}
button{background:#1d5b3c;border:1px solid #2f855a;color:#fff;padding:10px 16px;border-radius:8px;cursor:pointer;font-size:14px}
button:hover{background:#247248}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;background:#0f2b1f;border:1px solid #1d4432;border-radius:14px;padding:18px;margin-bottom:22px}
form h2{grid-column:1/-1;font-size:16px;color:#c9e8d6}
table{width:100%;border-collapse:collapse;background:#0f2b1f;border-radius:12px;overflow:hidden}
th,td{padding:12px 14px;text-align:left;font-size:14px;border-bottom:1px solid #1d4432}
th{background:#123626;color:#4ade80;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
tr:hover td{background:#123626}
.badge{padding:3px 10px;border-radius:20px;font-size:12px;white-space:nowrap;text-transform:capitalize}
.b-new{background:#3b3b1d;color:#fde047}.b-quoted{background:#1e3a5f;color:#60a5fa}.b-scheduled{background:#3a2a5f;color:#c084fc}.b-completed{background:#1d5b3c;color:#4ade80}.b-paid{background:#0f3d2e;color:#34d399}
.ago{color:#9dc7af;font-size:12px}
.del{background:none;border:none;color:#f87171;cursor:pointer;padding:2px 6px}
.empty{text-align:center;color:#9dc7af;padding:40px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
a.btn{background:#1d5b3c;border:1px solid #2f855a;color:#fff;padding:10px 16px;border-radius:8px;text-decoration:none;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>🪠 Jobs Tracker</h1>
  <div class="actions">
    <span id="syncStatus">connecting…</span>
    <a class="btn" href="https://www.notion.so/3e3bc778e6858176a26fc36e57527f8d" target="_blank">Notion ↗</a>
    <a class="back" href="index.html">← Master App</a>
  </div>
</header>
<div class="search-row">
  <input id="search" placeholder="🔍 Search name, address, zone, phone, notes…" oninput="render()">
  <select id="fStatus" onchange="render()">
    <option value="">All statuses</option><option value="new">New</option><option value="quoted">Quoted</option><option value="scheduled">Scheduled</option><option value="completed">Completed</option><option value="paid">Paid</option>
  </select>
  <button onclick="exportCSV()">Export CSV</button>
</div>
<form id="jobForm">
  <h2>➕ Add Job</h2>
  <input id="customer" placeholder="Customer Name *" required>
  <input id="address" placeholder="Address">
  <input id="zone" placeholder="Zone (e.g. Winnipeg, Steinbach)">
  <input id="phone" placeholder="Phone">
  <select id="status"><option value="new">New</option><option value="quoted">Quoted</option><option value="scheduled">Scheduled</option><option value="completed">Completed</option><option value="paid">Paid</option></select>
  <input id="quoteAmt" type="number" step="0.01" placeholder="Quote Amount ($)">
  <input id="notes" placeholder="Notes" style="grid-column:1/-1">
  <button type="submit">Save Job</button>
</form>
<div id="list"></div>
</div>
<script>
const SB_URL='https://fhbqxujlnqlmzvulrdxt.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZoYnF4dWpsbnFsbXp2dWxyZHh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2MTc0NDQsImV4cCI6MjEwMzE5MzQ0NH0.ThFmY_FXQlnaaI8GNLz9xSHATOacM9iOb8u0G0WFJ2w';
const sb=supabase.createClient(SB_URL,SB_KEY);
let jobs=[];
const syncEl=document.getElementById('syncStatus');
function setSync(t,c){syncEl.textContent=t;syncEl.className=c||'';}
async function load(){
  const {data,error}=await sb.from('gg_projects').select('*').order('updated_at',{ascending:false,nullsFirst:false});
  if(error){setSync('⚠ offline mode','err');jobs=JSON.parse(localStorage.getItem('gg_projects')||'[]');}
  else{jobs=data||[];setSync('✅ synced with cloud ('+jobs.length+' jobs)','ok');}
  render();
}
function timeAgo(d){if(!d)return'';const s=(Date.now()-new Date(d).getTime())/1e3;
 if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';
 if(s<604800)return Math.floor(s/86400)+'d ago';return Math.floor(s/604800)+'w ago';}
function badge(s){return 'b-'+(s||'new').toLowerCase();}
function quoteTotal(j){return j.quote&&j.quote.total!=null?Number(j.quote.total):null;}
function render(){
  const q=document.getElementById('search').value.toLowerCase(),fs=document.getElementById('fStatus').value;
  const rows=jobs.map((j,i)=>({...j,i})).filter(j=>{
    if(fs&&(j.status||'').toLowerCase()!==fs)return false;
    return !q||[j.customer,j.address,j.zone,j.phone,j.notes].join(' ').toLowerCase().includes(q);
  });
  if(!rows.length){document.getElementById('list').innerHTML='<div class="empty">No jobs found. Add your first job above 👆</div>';return;}
  document.getElementById('list').innerHTML=`<table><thead><tr>
    <th>Customer</th><th>Address</th><th>Zone</th><th>Phone</th><th>Status</th><th>Quote</th><th>Updated</th><th>Notes</th><th></th></tr></thead><tbody>
    ${rows.map(j=>{const qa=quoteTotal(j);return `<tr><td><b>${esc(j.customer)}</b></td><td>${esc(j.address)}</td><td>${esc(j.zone)}</td>
    <td>${j.phone?esc(j.phone):''}</td>
    <td><span class="badge ${badge(j.status)}">${j.status||'new'}</span></td>
    <td>${qa!=null?'$'+qa.toLocaleString():''}</td>
    <td><span class="ago">${timeAgo(j.updated_at||j.created_at)}</span><br><span class="ago">${(j.updated_at||j.created_at)?new Date(j.updated_at||j.created_at).toLocaleDateString():''}</span></td>
    <td>${esc(j.notes)}</td>
    <td><button class="del" onclick="del(${j.i})" title="Delete">✕</button></td></tr>`;}).join('')}
  </tbody></table>`;
}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
async function del(i){const j=jobs[i];if(!confirm('Delete '+(j.customer||'this job')+'?'))return;
  if(j.id){const{error}=await sb.from('gg_projects').delete().eq('id',j.id);if(error)setSync('⚠ delete failed','err');}
  jobs.splice(i,1);render();}
function exportCSV(){
  const h=['Customer','Address','Zone','Phone','Status','Quote Total','Quote Text','Created','Updated','Notes'];
  const csv=[h].concat(jobs.map(j=>[j.customer,j.address,j.zone,j.phone,j.status,quoteTotal(j),j.quote_text,j.created_at,j.updated_at,j.notes])).map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='gutter-genie-jobs.csv';a.click();
}
document.getElementById('jobForm').addEventListener('submit',async e=>{e.preventDefault();
  const row={customer:customer.value,address:address.value||null,zone:zone.value||null,phone:phone.value||null,status:status.value,
    quote:quoteAmt.value?{total:Number(quoteAmt.value)}:null,notes:notes.value||null};
  const{data,error}=await sb.from('gg_projects').insert(row).select();
  if(error){setSync('⚠ save failed — check connection','err');return;}
  jobs.unshift(data[0]);setSync('✅ synced with cloud ('+jobs.length+' jobs)','ok');e.target.reset();render();});
load();
// Realtime: update live if jobs are added elsewhere
sb.channel('gg_projects_rt').on('postgres_changes',{event:'*',schema:'public',table:'gg_projects'},()=>load()).subscribe();
</script>
</body>
</html>
